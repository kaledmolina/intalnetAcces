version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intalnetacces_app
    restart: always
    environment:
      APP_NAME: "IntalnetAcces"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "https://access.intalnet.com"
      DB_CONNECTION: "sqlite"
      DB_DATABASE: "/var/www/html/database/database.sqlite"
    volumes:
      - storage_data:/var/www/html/storage
      - db_data:/var/www/html/database
    networks:
      - intalnet_net

  web:
    image: nginx:alpine
    container_name: intalnetacces_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - storage_data:/var/www/html/storage
      - ./public:/var/www/html/public:ro
      - certbot_etc:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - intalnet_net

volumes:
  storage_data:
  db_data:
  certbot_etc:

networks:
  intalnet_net:
    driver: bridge
